<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My app</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<!-- A new app starts here: copy this folder to apps/<your-app>/ and read ../parts/README.md › The parts before adding
     to it. Name each thing for what it is and end with its kind: rename thing-list to recipe-list and it is still a
     list. The page says what is on the screen; app.js fills it in. No class, no id, no div. -->
<link rel="stylesheet" href="../parts/parts.css">
<script type="module" src="app.js"></script>
</head>
<body>
<app-page>
  <header>
    <h1>My app</h1>
    <button primary name="add">Add one</button>
  </header>
  <main>
    <thing-list></thing-list>
    <empty-notice>
      <h2>Nothing here yet</h2>
      <p>Add the first one to get going.</p>
    </empty-notice>
  </main>
</app-page>
</body>
</html>
