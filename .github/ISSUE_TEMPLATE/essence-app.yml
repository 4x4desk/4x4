name: Offer an essence app
description: You'd like to build an app, cut down to its essence, from an open source project.
labels: ["essence app", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you. An essence app is an app cut down to what a person needs, built from the shared parts.
        CONTRIBUTING.md › "The easy way in" says what one is made of. Opening this first lets us check the idea together before you build.
  - type: textarea
    id: project
    attributes:
      label: Which project
      description: Its name and link.
    validations:
      required: true
  - type: input
    id: licence
    attributes:
      label: Its licence
      description: It must allow the code to be shared under the AGPL-3.0 (most open source licences do; say if you're not sure).
    validations:
      required: true
  - type: textarea
    id: cut
    attributes:
      label: What you'd keep, and what you'd cut
      description: What a person reaches for, and what you'd leave out.
    validations:
      required: true
  - type: textarea
    id: help
    attributes:
      label: Anything you'd like help with
    validations:
      required: false
