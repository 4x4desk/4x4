# The checks every pull request and every change to main must pass.
#   files:    tools/check (links resolve, no file over 1 MB, no .DS_Store, scripts parse, labels defined).
#             Run it yourself first: python3 tools/check
#   sign-off: every commit in a pull request carries a Signed-off-by line (CONTRIBUTING.md › Sign-off).
name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Links, sizes, .DS_Store, JavaScript syntax, labels
        run: python3 tools/check

  sign-off:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Every commit is signed off
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for c in $(git rev-list --no-merges "$BASE..$HEAD"); do
            if ! git log -1 --format=%B "$c" | grep -qE '^Signed-off-by: .+ <[^>]+>$'; then
              echo "::error::Commit $(git log -1 --format='%h %s' "$c") has no Signed-off-by line."
              missing=1
            fi
          done
          if [ "$missing" = 1 ]; then
            echo "Add the line to every commit: git rebase --signoff $BASE, then push again (git push --force-with-lease)."
            exit 1
          fi
          echo "Every commit is signed off."
